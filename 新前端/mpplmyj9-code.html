<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sleep Schedule</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-bright": "#f9f9ff",
                        "surface-tint": "#095bbf",
                        "surface-container-low": "#f1f3ff",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#ecf0ff",
                        "surface-dim": "#d4daeb",
                        "tertiary": "#332eb2",
                        "tertiary-container": "#4c4aca",
                        "on-surface": "#151c28",
                        "background": "#f9f9ff",
                        "surface-container-highest": "#dde2f3",
                        "error": "#ba1a1a",
                        "on-background": "#151c28",
                        "surface-variant": "#dde2f3",
                        "tertiary-fixed-dim": "#c2c1ff",
                        "primary-container": "#0058bc",
                        "secondary-fixed": "#72fe88",
                        "on-primary-fixed-variant": "#004494",
                        "secondary": "#006e28",
                        "surface-container": "#e8eeff",
                        "inverse-primary": "#adc6ff",
                        "on-primary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e2e8f9",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2a303d",
                        "on-primary-fixed": "#001a41",
                        "on-secondary-container": "#00732a",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary": "#ffffff",
                        "primary": "#00418f",
                        "on-tertiary-fixed": "#0b006b",
                        "on-secondary-fixed-variant": "#00531c",
                        "on-secondary-fixed": "#002107",
                        "secondary-fixed-dim": "#53e16f",
                        "on-primary-container": "#c3d4ff",
                        "tertiary-fixed": "#e2dfff",
                        "primary-fixed-dim": "#adc6ff",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c2c6d5",
                        "secondary-container": "#6ffb85",
                        "on-tertiary-container": "#d2d1ff",
                        "on-surface-variant": "#424753",
                        "outline": "#727784",
                        "surface": "#f9f9ff",
                        "on-tertiary-fixed-variant": "#3531b4"
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "sm": "0.25rem",
                        "md": "0.75rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "1.5rem",
                        "3xl": "2rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Manrope", "sans-serif"],
                        "display": ["Manrope", "sans-serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background: radial-gradient(circle at 10% 10%, rgba(0, 65, 143, 0.05), transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(51, 46, 178, 0.05), transparent 40%),
                        #f9f9ff;
            min-height: 100vh;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(32px);
            border: 1px solid;
            border-image-source: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.1) 100%);
            border-image-slice: 1;
        }

        .liquid-gradient {
            background: linear-gradient(135deg, #00418f 0%, #332eb2 100%);
        }

        .text-tracking-tightest { letter-spacing: -0.04em; }
        .text-tracking-tight { letter-spacing: -0.02em; }
        .text-tracking-wide { letter-spacing: 0.06em; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background bg-background pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-xl border-b border-outline-variant/20 shadow-[inset_0_1px_1px_0_rgba(255,255,255,0.15)] flex items-center justify-between px-6 h-16 w-full md:hidden">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high border border-outline-variant/30 flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
</div>
<h1 class="font-headline font-extrabold text-2xl tracking-tighter text-primary">Vela</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:opacity-80 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</header>
<main class="pt-24 px-5 max-w-3xl mx-auto space-y-8">
<!-- Header Section -->
<section class="space-y-2">
<h2 class="font-headline text-3xl font-bold text-tracking-tight text-on-surface">Sleep Schedule</h2>
<p class="font-body text-base text-on-surface-variant">Optimize your rest for peak performance.</p>
</section>
<!-- Dial Card -->
<section class="glass-panel rounded-3xl p-6 relative overflow-hidden flex flex-col items-center shadow-[0_8px_32px_rgba(0,65,143,0.05)]">
<!-- Simulated Dial UI -->
<div class="relative w-64 h-64 my-6">
<!-- Outer Track -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="#e8eeff" stroke-width="8"></circle>
<!-- Highlighted Arc (Bedtime to Wake Up) -->
<circle class="filter drop-shadow-[0_4px_8px_rgba(0,65,143,0.3)]" cx="50" cy="50" fill="none" r="45" stroke="url(#liquidGrad)" stroke-dasharray="283" stroke-dashoffset="80" stroke-linecap="round" stroke-width="8"></circle>
<defs>
<lineargradient id="liquidGrad" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#00418f"></stop>
<stop offset="100%" stop-color="#332eb2"></stop>
</lineargradient>
</defs>
</svg>
<!-- Center Content -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-label text-xs uppercase text-tracking-wide text-on-surface-variant mb-1">Duration</span>
<span class="font-display text-4xl font-extrabold text-tracking-tightest text-primary">7h 45m</span>
</div>
<!-- Handles (Simulated) -->
<div class="absolute top-[8%] left-[20%] w-6 h-6 bg-surface rounded-full shadow-md border-2 border-primary flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[12px] text-primary" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
<div class="absolute bottom-[20%] right-[8%] w-6 h-6 bg-surface rounded-full shadow-md border-2 border-tertiary flex items-center justify-center transform translate-x-1/2 translate-y-1/2 cursor-pointer hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[12px] text-tertiary" style="font-variation-settings: 'FILL' 1;">alarm</span>
</div>
</div>
<!-- Time Display -->
<div class="flex justify-between w-full mt-4 pt-4 border-t border-outline-variant/20">
<div class="text-center">
<span class="block font-label text-xs uppercase text-tracking-wide text-on-surface-variant mb-1">Bedtime</span>
<span class="font-headline text-lg font-bold text-on-surface">10:30 PM</span>
</div>
<div class="text-center">
<span class="block font-label text-xs uppercase text-tracking-wide text-on-surface-variant mb-1">Wake up</span>
<span class="font-headline text-lg font-bold text-on-surface">6:15 AM</span>
</div>
</div>
</section>
<!-- Settings List -->
<section class="space-y-4">
<h3 class="font-label text-xs uppercase text-tracking-wide text-on-surface-variant pl-2">Options</h3>
<div class="glass-panel rounded-2xl p-1 divide-y divide-outline-variant/10">
<!-- Toggle Item 1 -->
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-surface-container-low/50 rounded-xl transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">monitoring</span>
</div>
<div>
<span class="block font-headline text-base font-semibold text-on-surface">Advanced Tracking</span>
<span class="block font-body text-sm text-on-surface-variant">Monitor sleep stages &amp; HR</span>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface appearance-none cursor-pointer transition-transform duration-200 ease-in-out translate-x-6 checked:border-primary" id="toggle1" name="toggle" style="accent-color: #0058bc;" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-primary cursor-pointer" for="toggle1"></label>
</div>
</label>
<!-- Toggle Item 2 -->
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-surface-container-low/50 rounded-xl transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-tertiary-container/10 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">vibration</span>
</div>
<div>
<span class="block font-headline text-base font-semibold text-on-surface">Smart Alarm</span>
<span class="block font-body text-sm text-on-surface-variant">Wake during light sleep</span>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface appearance-none cursor-pointer transition-transform duration-200 ease-in-out translate-x-6 checked:border-primary" id="toggle2" name="toggle" style="accent-color: #0058bc;" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-primary cursor-pointer" for="toggle2"></label>
</div>
</label>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-6 left-0 right-0 flex justify-around items-center px-6 py-3 z-50 mx-auto max-w-md bg-surface-container-lowest/92 backdrop-blur-[24px] border border-outline-variant/30 shadow-[0_30px_60px_-12px_rgba(27,28,26,0.04)] shadow-[inset_0_1px_1px_0_rgba(255,255,255,0.15)] rounded-full md:hidden">
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-surface-container-high/50 rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-surface-container-high/50 rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">auto_stories</span>
</button>
<button class="flex items-center justify-center text-on-surface-variant w-12 h-12 hover:bg-surface-container-high/50 rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">colors_spark</span>
</button>
<!-- Active Tab (Mapping to Sleep/Vitals semantic intent) -->
<button class="flex items-center justify-center bg-primary-container text-on-primary-container rounded-full w-12 h-12 shadow-lg shadow-primary-container/20 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">monitoring</span>
</button>
</nav>
<style>
        /* Custom Checkbox Toggle Styles inline for simplicity without complex JS */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #0058bc;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #0058bc;
        }
        .toggle-checkbox:not(:checked) {
            transform: translateX(0);
            border-color: #727784;
        }
        .toggle-checkbox:not(:checked) + .toggle-label {
            background-color: #c2c6d5;
        }
    </style>
</body></html>
