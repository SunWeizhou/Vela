  - main [ref=e16]:
    - heading "我们的使命是延长全民健康寿命" [level=1] [ref=e21]
    - generic [ref=e24]:
      - generic [ref=e27]:
        - img [ref=e30]
        - generic [ref=e42]:
          - heading "健康不会主动找上门" [level=2] [ref=e43]:
            - strong [ref=e44]: 健康不会主动找上门
          - generic [ref=e45]:
            - paragraph [ref=e46]: 嘿，朋友：
            - paragraph [ref=e47]: 如果你在读这段话，那你大概和我们一样 — 每天奔波于工作与家庭之间，并努力保持健康。
            - paragraph [ref=e48]: 你可能经历过在专科门诊排队数月、凌晨两点上 Google 搜索自己的症状，或者虔诚地遵从你最喜欢的播客主播的最新健康建议。
            - paragraph [ref=e49]: 但你是否曾想过：我们何以至此？ 从依靠自己和社区来管理健康，转变为依赖医生、WebMD 和前赴后继的健康专家组成的复杂体系，这中间发生了什么？
            - paragraph [ref=e50]: 为了回答这些问题并解释 Bevel 诞生的原因，我们先回顾一下历史。
            - paragraph [ref=e51]: 在人类的历史长河中，健康曾是一种极具个人化和社区特征的实践。 人们是自身健康的第一道防线，能够敏锐感知自己的身体与环境变化。 像阿育吠陀和中医这样的古老体系都将健康视为一个整体，认为生活方式、饮食和社区是健康福祉不可或缺的部分。 健康无需外包 — 它早已融入日常生活的点滴之中。
            - paragraph [ref=e52]: 时间快进到 19 世纪。 细菌的发现引发了医学革命。 疾病终于有了科学解释。 这带来了无比惊人的进步 – 疫苗、抗生素和外科手术等奇迹接连诞生。
            - paragraph [ref=e53]: 但另一种转变悄然发生。 随着医学变得愈加复杂，我们开始将自己的身体视为需要专业技师修理的机器。
            - paragraph [ref=e54]: 20 世纪，医疗保健走向产业化。 保险公司、制药巨头和连锁医院应运而生。 他们承诺接管健康，我们欣然交出钥匙。
            - paragraph [ref=e55]: 如今，我们身处 21 世纪。 我们能把机器人送上火星、教会 AI 写诗，却仍未破解人类健康的密码。
            - paragraph [ref=e56]: 慢性病发病率飙升。 寿命延长不代表生活质量的提升。 我们成了医疗保健的被动消费者，而非自身健康的积极参与者。
            - paragraph [ref=e57]: 这就是 Bevel 诞生的初衷。 我们想重拾“知身莫若己”这一理念。 我们绝非否定现代医学。 但我们坚信，你应该成为自己健康的 CEO，让医生和技术成为你的顾问而非管理者。
            - paragraph [ref=e58]: Bevel 不只是又一款健康 App。 它是一种整合所有健康数据的综合系统，可以提供帮助你做出明智决策的各类工具。 Bevel 让你主导自己的健康，而不是被动接受结果。
            - paragraph [ref=e59]: Bevel 信奉世界一流的设计。 这款 App 不局限于图表和数字，而是用简洁直观的界面提供富有实用价值的洞察。 我们还坚信健康数据应当可以互通。 用户应当能够自由选择穿戴设备，拒绝生态绑架。
            - paragraph [ref=e60]: 最后，我们极其重视隐私和安全。 未经你的明确许可，我们绝不存储你的数据，也绝不向第三方出售或分享你的信息。
            - paragraph [ref=e61]: 这就是 Bevel。 我们的故事才刚刚开篇。 未来还有更多精彩。 我们期待像你这样的早期采用者，助力共创个人健康新纪元。 如果你感到好奇，欢迎体验 Bevel 并分享你的想法！
          - paragraph [ref=e63]:
            - text: Ben、Grey 和 Aditya
            - text: Bevel 联合创始人
