<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sleep Schedule</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "on-surface-variant": "#424753",
                "on-error-container": "#93000a",
                "tertiary-fixed-dim": "#c2c1ff",
                "secondary-fixed-dim": "#53e16f",
                "on-background": "#151c28",
                "surface-container-low": "#f1f3ff",
                "on-tertiary-container": "#d2d1ff",
                "primary": "#00418f",
                "outline-variant": "#c2c6d5",
                "secondary-fixed": "#72fe88",
                "inverse-primary": "#adc6ff",
                "on-surface": "#151c28",
                "primary-container": "#0058bc",
                "surface-container-highest": "#dde2f3",
                "surface": "#f9f9ff",
                "outline": "#727784",
                "on-secondary-fixed-variant": "#00531c",
                "surface-tint": "#095bbf",
                "surface-container-high": "#e2e8f9",
                "surface-bright": "#f9f9ff",
                "on-primary": "#ffffff",
                "surface-variant": "#dde2f3",
                "secondary-container": "#6ffb85",
                "on-tertiary": "#ffffff",
                "surface-container": "#e8eeff",
                "primary-fixed": "#d8e2ff",
                "surface-dim": "#d4daeb",
                "primary-fixed-dim": "#adc6ff",
                "tertiary-container": "#4c4aca",
                "surface-container-lowest": "#ffffff",
                "on-secondary-container": "#00732a",
                "inverse-surface": "#2a303d",
                "on-secondary-fixed": "#002107",
                "tertiary-fixed": "#e2dfff",
                "on-error": "#ffffff",
                "tertiary": "#332eb2",
                "error": "#ba1a1a",
                "secondary": "#006e28",
                "on-tertiary-fixed-variant": "#3531b4",
                "on-tertiary-fixed": "#0b006b",
                "on-primary-fixed-variant": "#004494",
                "on-primary-fixed": "#001a41",
                "error-container": "#ffdad6",
                "on-secondary": "#ffffff",
                "inverse-on-surface": "#ecf0ff",
                "background": "#F5F3F0",
                "on-primary-container": "#c3d4ff"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "2xl": "1.5rem",
                "3xl": "2rem",
                "full": "9999px"
        },
        "spacing": {},
        "fontFamily": {
                "headline": [
                        "Manrope", "sans-serif"
                ],
                "display": [
                        "Manrope", "sans-serif"
                ],
                "body": [
                        "Manrope", "sans-serif"
                ],
                "label": [
                        "Manrope", "sans-serif"
                ]
        },
        "fontSize": {}
},
    },
  }
</script>
<style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #F5F3F0;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }

        .text-tracking-tightest { letter-spacing: -0.04em; }
        .text-tracking-tight { letter-spacing: -0.02em; }
        .text-tracking-wide { letter-spacing: 0.06em; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-background bg-background pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#F5F3F0]/80 backdrop-blur-xl border-b border-white/50 flex items-center justify-between px-6 h-16 w-full md:hidden">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden bg-white/50 border border-white flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
</div>
<h1 class="font-headline font-extrabold text-2xl tracking-tighter text-[#0058bc]">Vela</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-[#0058bc] hover:opacity-80 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
</header>
<main class="pt-24 px-5 max-w-3xl mx-auto space-y-8">
<!-- Header Section -->
<section class="space-y-2">
<h2 class="font-headline text-3xl font-bold text-tracking-tight text-on-surface">Sleep Schedule</h2>
<p class="font-body text-base text-on-surface-variant">Optimize your rest for peak performance.</p>
</section>
<!-- Dial Card -->
<section class="glass-panel rounded-3xl p-6 relative overflow-hidden flex flex-col items-center">
<!-- Simulated Dial UI -->
<div class="relative w-64 h-64 my-6">
<!-- Outer Track -->
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="rgba(0,0,0,0.05)" stroke-width="8"></circle>
<!-- Highlighted Arc (Bedtime to Wake Up) -->
<circle class="filter drop-shadow-[0_4px_8px_rgba(0,88,188,0.2)]" cx="50" cy="50" fill="none" r="45" stroke="#0058bc" stroke-dasharray="283" stroke-dashoffset="80" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Center Content -->
<div class="absolute inset-0 flex flex-col items-center justify-center">
<span class="font-label text-xs uppercase text-tracking-wide text-on-surface-variant mb-1">Duration</span>
<span class="font-display text-4xl font-extrabold text-tracking-tightest text-[#0058bc]">7h 45m</span>
</div>
<!-- Handles (Simulated) -->
<div class="absolute top-[8%] left-[20%] w-6 h-6 bg-surface rounded-full shadow-md border-2 border-[#0058bc] flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 cursor-pointer hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[12px] text-[#0058bc]" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
<div class="absolute bottom-[20%] right-[8%] w-6 h-6 bg-surface rounded-full shadow-md border-2 border-[#0058bc] flex items-center justify-center transform translate-x-1/2 translate-y-1/2 cursor-pointer hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-[12px] text-[#0058bc]" style="font-variation-settings: 'FILL' 1;">alarm</span>
</div>
</div>
<!-- Time Display -->
<div class="flex justify-between w-full mt-4 pt-4 border-t border-outline-variant/20">
<div class="text-center">
<span class="block font-label text-xs uppercase text-tracking-wide text-on-surface-variant mb-1">Bedtime</span>
<span class="font-headline text-lg font-bold text-on-surface">10:30 PM</span>
</div>
<div class="text-center">
<span class="block font-label text-xs uppercase text-tracking-wide text-on-surface-variant mb-1">Wake up</span>
<span class="font-headline text-lg font-bold text-on-surface">6:15 AM</span>
</div>
</div>
</section>
<!-- Settings List -->
<section class="space-y-4">
<h3 class="font-label text-xs uppercase text-tracking-wide text-on-surface-variant pl-2">Options</h3>
<div class="glass-panel rounded-3xl p-1 divide-y divide-outline-variant/10">
<!-- Toggle Item 1 -->
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-black/5 rounded-3xl transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#0058bc]/10 flex items-center justify-center text-[#0058bc]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">monitoring</span>
</div>
<div>
<span class="block font-headline text-base font-semibold text-on-surface">Advanced Tracking</span>
<span class="block font-body text-sm text-on-surface-variant">Monitor sleep stages &amp; HR</span>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface appearance-none cursor-pointer transition-transform duration-200 ease-in-out translate-x-6 checked:border-[#0058bc]" id="toggle1" name="toggle" style="accent-color: #0058bc;" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-[#0058bc] cursor-pointer" for="toggle1"></label>
</div>
</label>
<!-- Toggle Item 2 -->
<label class="flex items-center justify-between p-4 cursor-pointer hover:bg-black/5 rounded-3xl transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-[#0058bc]/10 flex items-center justify-center text-[#0058bc]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">vibration</span>
</div>
<div>
<span class="block font-headline text-base font-semibold text-on-surface">Smart Alarm</span>
<span class="block font-body text-sm text-on-surface-variant">Wake during light sleep</span>
</div>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface appearance-none cursor-pointer transition-transform duration-200 ease-in-out translate-x-6 checked:border-[#0058bc]" id="toggle2" name="toggle" style="accent-color: #0058bc;" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-[#0058bc] cursor-pointer" for="toggle2"></label>
</div>
</label>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-[400px] z-50 rounded-full bg-white/40 backdrop-blur-3xl border border-white/50 shadow-2xl h-16 md:hidden">
<div class="flex justify-around items-center px-4 h-full">
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-[#0058bc] transition-all duration-300 w-16">
<span class="material-symbols-outlined text-[24px]">calendar_today</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-[#0058bc] transition-all duration-300 w-16">
<span class="material-symbols-outlined text-[24px]">auto_stories</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/70 hover:text-[#0058bc] transition-all duration-300 w-16">
<span class="material-symbols-outlined text-[24px]">colors_spark</span>
</button>
<!-- Active Tab -->
<button class="flex flex-col items-center justify-center bg-[#0058bc] text-white rounded-full w-12 h-12 shadow-lg shadow-[#0058bc]/30 scale-110 transition-transform duration-300 ease-out">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">monitoring</span>
</button>
</div>
</nav>
<style>
        /* Custom Checkbox Toggle Styles inline for simplicity without complex JS */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #0058bc;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #0058bc;
        }
        .toggle-checkbox:not(:checked) {
            transform: translateX(0);
            border-color: rgba(0,0,0,0.1);
        }
        .toggle-checkbox:not(:checked) + .toggle-label {
            background-color: rgba(0,0,0,0.1);
        }
    </style>
</body></html>
