                - generic [ref=e500]: "全新与改进 - 在生物年龄中新增“本周变化”部分，可视化显示每个生物标志物与上周相比如何影响你的年龄。你可以点击年龄下方的“与上周相比的变化”按钮来访问。 - 新增横幅，提醒你更新血液检测、吸烟习惯，并在结果处理中时通知你。 - 新增在将文档上传到健康记录之前预览、编辑或删除文档的方法。 - 改进了 Bevel Intelligence 中的聊天视图：图片现在可在表格内呈现，内容不再被裁剪，代码块可选择并复制。 - 改进了拥有大量食物日志用户的手记加载时间和性能。 - 更新了 Bevel Intelligence 每周限制视图，以显示明确的日期和时间，而不是倒计时。 - 在 Bevel Intelligence 中新增当消息超过大小限制时显示的特定错误消息。 - 新增推荐帮助页，提供输入推荐码的分步说明。 错误修复 - 修复了健力助手训练在崩溃后卡住并继续运行，导致你无法重新打开它们的问题。 - 修复了此前退款订阅用户的推荐奖励兑换问题。 - 修复了部分生物标志物图表数据点和范围会显示在图表外的 UI 问题。 - 修复了来自 Apple Watch 的补水和咖啡因日志有时会显示为重复项的问题。 - 修复了健力助手中用户编辑的时长会被该组实际经过时间覆盖的问题。 - 修复了 Bevel Intelligence 回复中周期追踪上下文有时缺失或过时的问题。 关注我们的社交媒体以获取最新消息： - Reddit: r/bevelhealth - IG: @bevel.health - X: @bevel_health - YouTube: @bevelhealth 在此分享你的功能请求：https://feedback.bevel.health。 通过 Bevel 应用中的设置 > 报告错误来报告任何错误或问题。"
