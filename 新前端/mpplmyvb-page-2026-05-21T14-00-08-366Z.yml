        - paragraph [ref=e253]:
          - generic [ref=e255]: Bevel 是改善健康状况、提升表现和延长寿命的首选 App，获数十万用户信赖并拥有科学背书。 从睡眠、恢复、压力管理到力量训练，Bevel 将健康数据转化为真正可用的个性化指导。无论你是备战大赛还是追求日常状态提升，Bevel 都能助你更聪明地运动、更高效地恢复并延长寿命。 功能 Bevel Intelligence： 你的智能健康引擎。Bevel Intelligence 将你的多维度数据相关联，提供实时反馈和个性化建议。它会告知最佳训练时机、休息节点和进步阻碍因素。 恢复分数： 每日准备情况一目了然。通过显示身体的每日准备状态，帮助避免过度训练、预防受伤并培养更易长久坚持的习惯。 睡眠得分： 利用单一数字跟踪和评估你的睡眠状况。Bevel 会分析你的睡眠阶段、时长和睡眠中断，揭示每晚的真实休息质量。智能闹钟可在睡眠周期的最佳时刻唤醒你。 耗力分数： 全天监测身体负荷。根据睡眠和恢复状况生成个性化的耗力分数，帮助你以合适的强度训练并避免过度疲劳。 营养得分： 通过扫描条形码、搜索图片、创建食谱、描述餐食或搜索我们 600 万+ 种食物的数据库来记录每一餐。在一个地方设置卡路里、宏量营养素和营养目标。Bevel 还支持血糖跟踪，让你查看食物对新陈代谢的影响。 压力分数： 了解压力在身体上的表现形式。Bevel 提供实时评分，帮助你了解睡眠、体能训练和日常生活中的压力模式。 健力助手： 利用 Bevel 的力量训练模块更智能地训练。超过 700 种锻炼可供选择，在手表与手机之间同步体能训练，并实时接收肌肉耗力反馈。你甚至可以生成自定义计划或记录过往体能训练，从而持续跟踪进度。 能量储备： 把它想象成你身体的电池。Bevel 将恢复、睡眠、耗力和压力整合到一项指标中，帮助你了解一天中能量水平的积累和消耗情况。 生物年龄： 发现你身体的真实年龄。Bevel 通过睡眠、活动量、静息心率等关键健康指标计算你的生物年龄。追踪生活方式的改变如何产生影响，了解你的选择如何加速或减缓衰老。 健康档案： 将你的医疗数据导入 Bevel。导入化验结果、血液检查和临床记录，在一个地方全面掌握你的健康状况。了解各项指标的含义，并追踪随时间的变化趋势。 日记： 跟踪影响健康的习惯。使用日记记录补水、日照、屏幕使用时间等信息。Bevel 会展示这些细微行为如何累积并影响你的睡眠和恢复状况。 订阅与条款 Bevel 可以免费使用，你也可以选择通过自动续订订阅的方式升级为 Bevel Pro。你可以在 Apple ID 账户设置中关闭自动续订功能。 高级订阅将在确认购买后通过你的 Apple ID 扣费。订阅按周或按年自动续订，除非在当前周期结束前至少 24 小时取消，否则将自动续订。取消后，订阅有效期至当前周期结束，未使用部分不予退款。 完成购买，即表示你已了解并同意以下内容： 服务条款：https://docs.bevel.health/terms-of-service 隐私政策：https://docs.bevel.health/privacy-policy Bevel 并非医疗器械，不可用于诊断、治疗、治愈、监测或预防任何疾病。请务必先咨询你的医生。提供的所有信息仅作为一般参考。
