<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

                        "on-primary-fixed": "#001a41",
                        "inverse-surface": "#2a303d",

<style>
        body {
            background-color: #F5F3F0;
            font-family: 'Manrope', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.02);
        }

        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-surface min-h-screen relative pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#F5F3F0]/80 dark:bg-[#F5F3F0]/80 backdrop-blur-xl flex justify-between items-center px-6 py-4 max-w-screen-md mx-auto">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden border border-white/50">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="A close up, vibrant portrait of a young athletic woman with clear skin, slightly flushed cheeks from exercise, looking focused. The lighting is bright, soft, and natural, fitting a modern health app aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBfRzhucOerzoQynfPnSuobIB7YUmWvoYrWQPMfirt-1TNsXq3LJaUktpdLARV-TwS3V9R-4Rp59RbJLMd1nHnpRMQK8e23xlVDyfoJ_9m9G4H-Bm5mb4fji2G59F_hK0HcLOgeK3U-cx0pKyKy_L92egznYuu4SNhx0ekeerLpysggaCmPxN88Qll8657iZwok5myDz6oev6di6ENEiayTv3Iv3GKxY4w4QSQZAk5BNPEnM_IWMIzQeijvSlAot0_C9sJC2HHhddv-"/>
</div>
<h1 class="font-headline text-[24px] font-extrabold tracking-tight text-primary-container dark:text-primary-fixed">Outdoor Run</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" style="font-size: 24px;">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 px-5 max-w-screen-md mx-auto flex flex-col gap-4">
<!-- Primary Metric: Duration (Hero) -->
<section class="glass-panel rounded-3xl p-8 flex flex-col items-center justify-center relative overflow-hidden transition-transform duration-300 hover:scale-[1.02]">
<p class="font-label text-[12px] font-bold tracking-[0.06em] uppercase text-primary-container mb-2 z-10">Duration</p>
<h2 class="font-display text-[72px] font-[800] leading-none tracking-[-0.04em] text-on-surface z-10" id="duration-display">32:45</h2>
<!-- Active indicator dot -->
<div class="flex items-center gap-2 mt-4 z-10">
<div class="relative w-3 h-3">
<div class="absolute inset-0 rounded-full bg-primary-container"></div>
<div class="absolute inset-0 rounded-full bg-primary-container pulse-ring"></div>
</div>
<span class="font-label text-sm font-semibold text-primary-container">Active</span>
</div>
</section>
<!-- Secondary Metrics Grid (Bento) -->
<section class="grid grid-cols-2 gap-4">
<!-- Distance -->
<div class="glass-panel rounded-3xl p-5 flex flex-col justify-between h-32 transition-transform duration-300 hover:scale-[1.02]">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 18px;">route</span>
<p class="font-label text-[12px] font-bold tracking-[0.06em] uppercase">Distance</p>
</div>
<div class="flex items-baseline gap-1 mt-auto">
<span class="font-headline text-[32px] font-[700] tracking-[-0.02em] text-primary-container">4.2</span>
<span class="font-body text-[14px] font-[600] text-on-surface-variant">mi</span>
</div>
</div>
<!-- Pace -->
<div class="glass-panel rounded-3xl p-5 flex flex-col justify-between h-32 transition-transform duration-300 hover:scale-[1.02]">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 18px;">timer</span>
<p class="font-label text-[12px] font-bold tracking-[0.06em] uppercase">Pace</p>
</div>
<div class="flex items-baseline gap-1 mt-auto">
<span class="font-headline text-[32px] font-[700] tracking-[-0.02em] text-primary-container">7:45</span>
<span class="font-body text-[14px] font-[600] text-on-surface-variant">/mi</span>
</div>
</div>
<!-- Heart Rate (Spanning full width) -->
<div class="glass-panel rounded-3xl p-5 flex flex-col col-span-2 relative overflow-hidden transition-transform duration-300 hover:scale-[1.02]">
<div class="flex justify-between items-start z-10">
<div class="flex items-center gap-2 text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 18px;">favorite</span>
<p class="font-label text-[12px] font-bold tracking-[0.06em] uppercase text-primary-container">Heart Rate</p>
</div>
<span class="font-label text-xs font-semibold px-2 py-1 bg-surface-container-high rounded-sm text-primary-container">Zone 3 (Aerobic)</span>
</div>
<div class="flex items-end justify-between mt-4 z-10">
<div class="flex items-baseline gap-1">
<span class="font-headline text-[48px] font-[800] tracking-[-0.04em] text-on-surface leading-none">142</span>
<span class="font-body text-[14px] font-[600] text-on-surface-variant">bpm</span>
</div>
<!-- Mini visualizer -->
<div class="flex items-end gap-1 h-10">
<div class="w-1.5 bg-primary-container/40 rounded-full h-4"></div>
<div class="w-1.5 bg-primary-container/60 rounded-full h-6"></div>
<div class="w-1.5 bg-primary-container/80 rounded-full h-5"></div>
<div class="w-1.5 bg-primary-container rounded-full h-8"></div>
<div class="w-1.5 bg-primary-container rounded-full h-10"></div>
<div class="w-1.5 bg-primary-container rounded-full h-9"></div>
</div>
</div>
</div>
<!-- Map View Card -->
<div class="glass-panel rounded-3xl col-span-2 h-40 overflow-hidden relative group transition-transform duration-300 hover:scale-[1.02] border border-white/60">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A clean, minimalist 3D styled street map visualization of San Francisco. The map features soft grey roads against a warm white background, with a vibrant glowing cobalt blue line representing a running route winding through the streets." data-location="San Francisco" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA3Dn3DL8KAEfG4hXKjbQGyIduP70WMKIhHiAj28a73-i6CrIesvWOoaf-Uhj9YwDn8ysCYj_AJQPxYGxv8eFCH3ubc3Fu7aL9M6Zs0X0SeKURGLBUdcoNwnf3ALO_QqeFzEURECDhN6A-1viDIiI3dmAhtroFGTH_ysecdym7UzRFj72mDa6PeBqe927D3J1tO7rhrEJxo493yntmSTQn-3AmAz6lRR1HfP211j31uxbxwCuFe03ioXz7mjNznQJdEgfJhpZU4t8bs')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-[#F5F3F0]/80 to-transparent"></div>
<div class="absolute bottom-3 left-4 flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-white shadow-md flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1; font-size: 16px;">near_me</span>
</div>
<span class="font-body text-sm font-semibold text-on-surface">Golden Gate Park</span>
</div>
</div>
</section>
</main>
<!-- Floating Action Button (Pause/End) -->
<div class="fixed bottom-[110px] left-1/2 -translate-x-1/2 flex gap-4 z-40">
<button class="w-16 h-16 rounded-full bg-white/80 backdrop-blur-md shadow-lg flex items-center justify-center text-on-surface-variant hover:scale-105 transition-transform border border-white/40">
<span class="material-symbols-outlined" style="font-size: 28px;">stop</span>
</button>
<button class="w-16 h-16 rounded-full bg-primary-container shadow-[0_8px_24px_rgba(0,88,188,0.3)] flex items-center justify-center text-white hover:scale-105 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 28px;">pause</span>
</button>
</div>
<!-- BottomNavBar (Shared Component) -->
<nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-sm rounded-full border border-white/50 bg-white/60 backdrop-blur-2xl shadow-[0_8px_32px_0_rgba(0,0,0,0.05)] flex justify-around items-center p-2 z-50">
<!-- Home (Inactive) -->
<a class="flex items-center justify-center text-on-surface-variant/60 w-12 h-12 hover:scale-110 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">home_health</span>
</a>
<!-- Monitoring/Metrics (Inactive) -->
<a class="flex items-center justify-center text-on-surface-variant/60 w-12 h-12 hover:scale-110 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">monitoring</span>
</a>
<!-- Fitness/Activity (ACTIVE) -->
<a aria-current="page" class="flex items-center justify-center bg-primary-container text-white rounded-full w-12 h-12 shadow-lg shadow-primary-container/20 hover:scale-110 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex items-center justify-center text-on-surface-variant/60 w-12 h-12 hover:scale-110 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">person</span>
</a>
</nav>
<script>
        // Simple script to simulate the timer running
        document.addEventListener('DOMContentLoaded', () => {
            const display = document.getElementById('duration-display');
            let seconds = 32 * 60 + 45; // Start at 32:45

            setInterval(() => {
                seconds++;
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                display.textContent = `${m}:${s.toString().padStart(2, '0')}`;
            }, 1000);
        });
    </script>
</body></html>
