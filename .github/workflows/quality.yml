name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Verify toolchain matches .xcode-version
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test -d "/Applications/Xcode_26.5.0.app/Contents/Developer" || {
            echo "::error::Runner expects Xcode 26.5.0 (see .xcode-version). Update DEVELOPER_DIR when bumping."
            exit 1
          }

      - name: Schema version guard
        shell: bash
        run: |
          python3 scripts/schema_fingerprint.py --check

      - name: Contrast guard (textColor >= 4.5:1)
        shell: bash
        run: |
          python3 scripts/check_contrast.py

      - name: Fixed-font scan (report-only, track H1 cleanup)
        shell: bash
        run: |
          python3 scripts/check_fixed_fonts.py

      - name: SwiftLint (report-only until baseline is clean)
        shell: bash
        run: |
          set -euo pipefail
          if which swiftlint >/dev/null 2>&1; then
            swiftlint --config .swiftlint.yml || true
          else
            # macos runners 不预装 SwiftLint；安装后运行自定义规则审计
            brew install swiftlint >/dev/null 2>&1
            swiftlint --config .swiftlint.yml || true
          fi

      - name: Reject tracked dependencies
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)node_modules/' > /tmp/tracked-node-modules.txt; then
            echo "node_modules must not be tracked."
            head -n 20 /tmp/tracked-node-modules.txt
            exit 1
          fi

      - name: Build with warnings as errors
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project Vela.xcodeproj \
            -scheme Vela \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run iOS tests
        shell: bash
        run: |
          set -euo pipefail
          # 确定性选择：可用 iPhone 模拟器中名称排序第一个（取代 head -n 1 的非确定行为）
          device_id="$({ xcrun simctl list devices available -j | \
            jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone"))) | .name] | sort | .[0]'; } )"
          test -n "$device_id"
          set -o pipefail
          xcodebuild test \
            -project Vela.xcodeproj \
            -scheme Vela \
            -destination "platform=iOS Simulator,name=$device_id" \
            -derivedDataPath build/DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Coverage summary (report-only)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result_bundle=$(ls -td build/DerivedData/Logs/Test/*.xcresult 2>/dev/null | head -n 1 || true)
          if [ -n "$result_bundle" ]; then
            xcrun xccov view --report "$result_bundle" 2>/dev/null | tail -n 15 || true
          else
            echo "No xcresult bundle found; coverage report skipped."
          fi

      - name: Upload xcresult on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/DerivedData/Logs/Test/
          if-no-files-found: ignore

  backend:
    name: Backend tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Run Swift package tests
        run: swift test --package-path VelaBackend
